version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pw # Tells Postgres to look in memory for the password
      POSTGRES_DB: retail_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    secrets:
      - postgres_pw # Grants this specific container access to the secret
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: lab-clickhouse
    ports:
      - "8123:8123" # HTTP port for API/UI interactions
      - "9000:9000" # Native client port for bulk data ingestion
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Mounts a local folder directly into ClickHouse to read Parquet/JSON logs later
      - ../data:/var/lib/clickhouse/user_files/data
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: lab-metabase
    ports:
      - "3010:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

# Declare the secret
secrets:
  postgres_pw:
    file: ../secrets/db_password.txt # The physical file on our WSL drive

volumes:
  pg_data:
  clickhouse_data:
  metabase_data:
