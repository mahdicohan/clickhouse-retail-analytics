version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: retail_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: lab-clickhouse
    ports:
      - "8123:8123" # HTTP port for API/UI interactions
      - "9000:9000" # Native client port for bulk data ingestion
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Mounts a local folder directly into ClickHouse to read Parquet/JSON logs later
      - ../data_files:/var/lib/clickhouse/user_files/data_files
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: lab-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

volumes:
  pg_data:
  clickhouse_data:
  metabase_data:
